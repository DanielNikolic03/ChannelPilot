[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channelpilot"
version = "0.1.0"
description = "Accessible numpad control of Chromecast TV applications"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["androidtvremote2==0.3.2", "cryptography>=42", "evdev>=1.7,<2; sys_platform == 'linux'"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
channelpilot = "channelpilot.main:main"

[tool.setuptools.packages.find]
include = ["channelpilot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["hardware: requires a paired Chromecast and human observation"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
